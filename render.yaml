services:
  - type: web
    name: temple-mail
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DOMAINS
        value: atiar.dpdns.org
      - key: WEBHOOK_SECRET
        value: temple-secret-key-12345
      - key: EMAIL_TTL_MINUTES
        value: "60"
      - key: SITE_TITLE
        value: "Temple - Instant Temp Mail"
